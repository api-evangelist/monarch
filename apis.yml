aid: monarch
name: Monarch
description: >-
  Monarch (Monarch Money) is a modern personal finance and money-management app
  that brings a household's accounts, budgets, investments, and goals into one
  shared view. It aggregates connected bank, card, loan, and investment accounts,
  automatically categorizes transactions, and lets couples, families, and financial
  professionals collaborate on budgeting and net-worth tracking at no extra cost.
  Monarch is a direct-to-consumer subscription product ($99/year) and does not
  publish an official public developer API — account connectivity is handled by
  third-party aggregators and the app is driven by a private internal GraphQL
  backend (api.monarch.com/graphql, authenticated). A community-maintained,
  unofficial Python library reverse-engineers that backend. Monarch is a Menlo
  Ventures portfolio company; this profile was enriched from its public web surface.
